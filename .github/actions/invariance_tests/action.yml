name: Invariance tests

inputs:
  artifact-name:
    description: 'Name of the uploaded artifact'
    required: false
    default: 'invariance-test-results'

runs:
  using: "composite"
  steps:
    - name: Run invariance tests
      run: python INCHI-1-TEST/tests/test_library/inchi_tests/run_tests.py  --test-config=INCHI-1-TEST/tests/test_library/config/config_invariance.py --data-config=INCHI-1-TEST/tests/test_library/config/config_ci.py
      shell: bash

    - name: Write invariance summary
      if: '!cancelled()'
      run: python INCHI-1-TEST/tests/test_library/inchi_tests/parse_log.py  --test-config=INCHI-1-TEST/tests/test_library/config/config_invariance.py --data-config=INCHI-1-TEST/tests/test_library/config/config_ci.py
      shell: bash

    - name: Upload invariance test results
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ./INCHI-1-TEST/tests/test_library/data/ci/*_invariance_ci.log
          ./INCHI-1-TEST/tests/test_library/data/ci/*_invariance_ci_*.html
